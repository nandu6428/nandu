<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: #050505;
            color: #f5f5f5;
            overflow-x: hidden;
        }

        /* NAVIGATION */

        nav {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            padding: 20px 50px;

            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 1000;

            animation: navDown 0.8s ease;
        }

        nav h2 {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: #cfcfcf;
            font-weight: 500;

            transition: 0.3s;
        }

        nav a:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* HOME */

        .home {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 120px 30px 60px;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,0.05),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255,255,255,0.04),
                    transparent 30%
                ),
                #050505;
        }

        /* FLOATING CIRCLES */

        .circle {
            position: absolute;

            border-radius: 50%;

            background: rgba(255,255,255,0.025);

            border: 1px solid rgba(255,255,255,0.06);

            backdrop-filter: blur(5px);

            animation: float 7s ease-in-out infinite;
        }

        .circle1 {
            width: 180px;
            height: 180px;

            top: 15%;
            left: 8%;
        }

        .circle2 {
            width: 250px;
            height: 250px;

            bottom: 10%;
            right: 5%;

            animation-delay: 2s;
        }

        .circle3 {
            width: 100px;
            height: 100px;

            top: 65%;
            left: 20%;

            animation-delay: 1s;
        }

        /* MAIN GLASS BOX */

        .home-content {
            position: relative;
            z-index: 2;

            max-width: 850px;

            padding: 55px 50px;

            border-radius: 28px;

            background: rgba(255,255,255,0.06);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 1px rgba(255,255,255,0.05);

            animation: boxAppear 1.2s ease;
        }

        /* HEADING */

        .home h1 {
            font-size: clamp(40px, 7vw, 75px);

            margin-bottom: 20px;

            font-weight: 700;

            color: #ffffff;

            animation: titleIn 1.2s ease;
        }

        .home h1 span {
            color: #ffffff;

            display: inline-block;

            animation: pulse 3s ease-in-out infinite;
        }

        /* DESCRIPTION */

        .home p {
            font-size: 19px;

            max-width: 700px;

            margin: 0 auto 35px;

            line-height: 1.7;

            color: #bdbdbd;

            font-weight: 400;

            font-style: normal;

            animation: textIn 1.4s ease;
        }

        /* BUTTON */

        .button {
            display: inline-block;

            padding: 15px 32px;

            background: rgba(255,255,255,0.1);

            color: #ffffff;

            text-decoration: none;

            border-radius: 12px;

            font-weight: 600;

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 0 8px 25px rgba(0,0,0,0.3);

            animation: buttonIn 1.6s ease;

            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-6px) scale(1.05);

            background: rgba(255,255,255,0.16);

            border-color: rgba(255,255,255,0.3);

            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* SCROLL ARROW */

        .scroll-down {
            position: absolute;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 28px;

            color: #888;

            animation: arrow 1.5s ease-in-out infinite;
        }

        /* ANIMATIONS */

        @keyframes navDown {

            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }

        }

        @keyframes boxAppear {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes titleIn {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes textIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes buttonIn {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(8deg);
            }

        }

        @keyframes pulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

        }

        @keyframes arrow {

            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(12px);
            }

        }

        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
            }

            nav ul {
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            .home-content {
                padding: 40px 25px;
            }

            .home p {
                font-size: 17px;
            }

        }

    </style>
</head>

<body>

    <!-- NAVIGATION -->

    <nav>

        <h2>My Website</h2>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="library.html">Library</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

        </ul>

    </nav>


    <!-- HOME -->

    <section class="home">

        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>


        <div class="home-content">

            <h1>
                Welcome to
                <span>My Website</span>
            </h1>

            <p>
                A personal space where I share my photos,
                projects and a little bit about myself.
            </p>

            <a href="library.html" class="button">
                Explore Photo Library →
            </a>

        </div>


        <div class="scroll-down">
            ↓
        </div>

    </section>

</body>
</html>
