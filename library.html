 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library | My Website</title>

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #050505;
            color: white;
            overflow-x: hidden;
            width: 100%;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            background: rgba(5, 5, 5, 0.88);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            position: sticky;
            top: 0;
            z-index: 1000;
        }


        .logo {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }


        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }


        nav a {
            position: relative;

            color: #aaa;

            text-decoration: none;

            font-size: 15px;

            transition: 0.3s ease;
        }


        nav a:hover {
            color: white;
        }


        nav a.active {
            color: white;
        }


        nav a.active::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: -9px;

            height: 2px;

            background: white;

            border-radius: 10px;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            width: 100%;

            min-height: 45vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 80px 20px 60px;
        }


        .hero h1 {
            font-size: clamp(50px, 8vw, 85px);

            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 22px;

            background: linear-gradient(
                120deg,
                #ffffff,
                #777777
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .hero p {
            max-width: 650px;

            color: #888;

            font-size: 17px;

            line-height: 1.7;
        }


        /* =========================
           LIBRARY AREA
        ========================= */

        .library {
            width: 90%;
            max-width: 1400px;

            margin: 0 auto;

            padding-bottom: 100px;
        }


        .section-heading {
            margin-bottom: 30px;
        }


        .section-heading h2 {
            font-size: 30px;
            font-weight: 600;
        }


        /* =========================
           WALLPAPER GRID
        ========================= */

        .wallpaper-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 26px;
        }


        /* =========================
           WALLPAPER CARD
        ========================= */

        .wallpaper {
            width: 100%;

            overflow: hidden;

            border-radius: 20px;

            background: #0c0c0c;

            border: 1px solid rgba(255, 255, 255, 0.08);

            opacity: 0;

            transform: translateY(35px);

            animation: appear 0.7s ease forwards;

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }


        .wallpaper:nth-child(1) {
            animation-delay: 0.05s;
        }

        .wallpaper:nth-child(2) {
            animation-delay: 0.12s;
        }

        .wallpaper:nth-child(3) {
            animation-delay: 0.19s;
        }

        .wallpaper:nth-child(4) {
            animation-delay: 0.26s;
        }

        .wallpaper:nth-child(5) {
            animation-delay: 0.33s;
        }


        .wallpaper:hover {
            transform: translateY(-7px);

            border-color:
                rgba(255, 255, 255, 0.22);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55);
        }


        /* =========================
           IMAGE
        ========================= */

        .wallpaper img {
            display: block;

            width: 100%;

            height: 380px;

            object-fit: cover;

            transition:
                transform 0.7s ease;
        }


        .wallpaper:hover img {
            transform: scale(1.05);
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            width: 100%;

            text-align: center;

            padding: 45px 20px;

            color: #555;

            font-size: 14px;

            border-top:
                1px solid rgba(255, 255, 255, 0.06);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 950px) {

            .wallpaper-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 5%;
            }


            .logo {
                font-size: 20px;
            }


            nav {
                gap: 17px;
            }


            nav a {
                font-size: 13px;
            }


            .hero {
                min-height: 40vh;

                padding:
                    70px 20px
                    50px;
            }


            .hero h1 {
                font-size: 52px;

                letter-spacing: -1px;
            }


            .hero p {
                font-size: 15px;
            }


            .library {
                width: 92%;
            }


            .wallpaper-grid {
                grid-template-columns: 1fr;

                gap: 20px;
            }


            .wallpaper img {
                height: 360px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            My Website
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="library.html" class="active">
                Library
            </a>

            <a href="about.html">
                About
            </a>

        </nav>

    </header>



    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <h1>
            Library
        </h1>


        <p>
            Explore the collection.
        </p>

    </section>



    <!-- =========================
         WALLPAPERS
    ========================= -->

    <main class="library">

        <div class="section-heading">

            <h2>
                Collection
            </h2>

        </div>


        <div class="wallpaper-grid">


            <!-- IMAGE 1 -->

            <div class="wallpaper">

                <img
                    src="wallpaper1.jpg"
                    alt="Collection image"
                    loading="lazy"
                >

            </div>


            <!-- IMAGE 2 -->

            <div class="wallpaper">

                <img
                    src="wallpaper2.jpg"
                    alt="Collection image"
                    loading="lazy"
                >

            </div>


            <!-- IMAGE 3 -->

            <div class="wallpaper">

                <img
                    src="wallpaper3.jpg"
                    alt="Collection image"
                    loading="lazy"
                >

            </div>


            <!-- IMAGE 4 -->

            <div class="wallpaper">

                <img
                    src="wallpaper4.jpg"
                    alt="Collection image"
                    loading="lazy"
                >

            </div>


            <!-- IMAGE 5 -->

            <div class="wallpaper">

                <img
                    src="wallpaper5.jpg"
                    alt="Collection image"
                    loading="lazy"
                >

            </div>


        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © 2026 My Website

    </footer>


</body>

</html>
