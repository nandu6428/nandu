<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: rgba(11, 11, 15, 0.88);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }

        /* =========================
           HEADER
        ========================= */

        .library-header {
            text-align: center;
            padding: 70px 20px 45px;
        }

        .library-header h1 {
            font-size: clamp(36px, 6vw, 64px);
            margin-bottom: 15px;
        }

        .library-header p {
            color: #aaa;
            font-size: 16px;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        /* =========================
           GALLERY
        ========================= */

        .gallery {
            width: 90%;
            max-width: 1400px;
            margin: auto;
            padding-bottom: 80px;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .photo {
            position: relative;
            overflow: hidden;

            aspect-ratio: 16 / 10;

            border-radius: 16px;

            background: #15151b;

            cursor: pointer;

            opacity: 0;
            transform: translateY(20px);

            animation: appear 0.6s ease forwards;
        }

        @keyframes appear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .photo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform 0.5s ease;
        }

        .photo:hover img {
            transform: scale(1.06);
        }

        .photo::after {
            content: "View";

            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,0.35);

            opacity: 0;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .photo:hover::after {
            opacity: 1;
        }

        /* =========================
           PREVIEW
        ========================= */

        .preview {
            position: fixed;
            inset: 0;

            z-index: 2000;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(0,0,0,0.92);

            backdrop-filter: blur(10px);
        }

        .preview.show {
            display: flex;
        }

        .preview-image {
            max-width: 90vw;
            max-height: 82vh;

            object-fit: contain;

            border-radius: 10px;

            box-shadow: 0 20px 80px rgba(0,0,0,0.7);

            animation: previewIn 0.25s ease;
        }

        @keyframes previewIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-preview {
            position: absolute;
            top: 25px;
            right: 30px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,0.12);
            color: white;

            font-size: 25px;

            cursor: pointer;

            transition: 0.3s;
        }

        .close-preview:hover {
            background: rgba(255,255,255,0.25);
            transform: rotate(90deg);
        }

        /* =========================
           PREVIEW BUTTONS
        ========================= */

        .preview-controls {
            position: absolute;

            bottom: 30px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            background: rgba(255,255,255,0.12);
            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-2px);
        }

        .download-btn {
            background: white;
            color: black;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #eaeaea;
        }

        /* =========================
           EMPTY MESSAGE
        ========================= */

        .empty {
            text-align: center;
            color: #888;
            padding: 80px 20px;
            font-size: 18px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .library-header {
                padding: 50px 20px 35px;
            }

            .gallery {
                width: 92%;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .photo {
                border-radius: 10px;
            }

            .preview {
                padding: 15px;
            }

            .preview-image {
                max-width: 96vw;
                max-height: 75vh;
            }

            .preview-controls {
                bottom: 18px;
            }

            .control-btn {
                padding: 10px 14px;
                font-size: 13px;
            }

            .close-preview {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="logo">
            My Website
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="library.html" class="active">
                    Library
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="library-header">

        <h1>Photo Library</h1>

        <p>
            Explore the collection and open any photo
            to view it in full size or download it.
        </p>

    </header>


    <!-- =========================
         PHOTO GRID
         
         IMPORTANT:
         Put your images inside:
         
         images/
         
         Example:
         images/photo1.jpg
         images/photo2.jpg
         images/photo3.jpg
    ========================= -->

    <main class="gallery" id="gallery">

        <div class="photo">
            <img
                src="images/photo1.jpg"
                loading="lazy"
                alt="Photo"
            >
        </div>

        <div class="photo">
            <img
                src="images/photo2.jpg"
                loading="lazy"
                alt="Photo"
            >
        </div>

        <div class="photo">
            <img
                src="images/photo3.jpg"
                loading="lazy"
                alt="Photo"
            >
        </div>

        <div class="photo">
            <img
                src="images/photo4.jpg"
                loading="lazy"
                alt="Photo"
            >
        </div>

        <div class="photo">
            <img
                src="images/photo5.jpg"
                loading="lazy"
                alt="Photo"
            >
        </div>

        <div class="photo">
            <img
                src="images/photo6.jpg"
                loading="lazy"
                alt="Photo"
            >
        </div>

    </main>


    <!-- =========================
         PHOTO PREVIEW
    ========================= -->

    <div class="preview" id="preview">

        <button
            class="close-preview"
            id="closePreview"
            aria-label="Close preview"
        >
            ×
        </button>

        <img
            class="preview-image"
            id="previewImage"
            src=""
            alt="Preview"
        >

        <div class="preview-controls">

            <button
                class="control-btn"
                id="previousBtn"
            >
                ←
            </button>

            <button
                class="control-btn download-btn"
                id="downloadBtn"
            >
                ↓ Download
            </button>

            <button
                class="control-btn"
                id="nextBtn"
            >
                →
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const photos = document.querySelectorAll(".photo img");

        const preview = document.getElementById("preview");

        const previewImage =
            document.getElementById("previewImage");

        const closePreview =
            document.getElementById("closePreview");

        const downloadBtn =
            document.getElementById("downloadBtn");

        const previousBtn =
            document.getElementById("previousBtn");

        const nextBtn =
            document.getElementById("nextBtn");


        let currentIndex = 0;


        /* =========================
           OPEN PREVIEW
        ========================= */

        function openPreview(index) {

            currentIndex = index;

            previewImage.src =
                photos[currentIndex].src;

            preview.classList.add("show");

            document.body.style.overflow = "hidden";
        }


        /* =========================
           CLOSE PREVIEW
        ========================= */

        function closePreviewWindow() {

            preview.classList.remove("show");

            document.body.style.overflow = "";

            previewImage.src = "";
        }


        /* =========================
           NEXT PHOTO
        ========================= */

        function nextPhoto() {

            currentIndex++;

            if (currentIndex >= photos.length) {
                currentIndex = 0;
            }

            previewImage.src =
                photos[currentIndex].src;
        }


        /* =========================
           PREVIOUS PHOTO
        ========================= */

        function previousPhoto() {

            currentIndex--;

            if (currentIndex < 0) {
                currentIndex = photos.length - 1;
            }

            previewImage.src =
                photos[currentIndex].src;
        }


        /* =========================
           DOWNLOAD
        ========================= */

        function downloadPhoto() {

            const imageURL =
                photos[currentIndex].src;

            const link =
                document.createElement("a");

            link.href = imageURL;

            link.download =
                imageURL.split("/").pop();

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);
        }


        /* =========================
           CLICK EVENTS
        ========================= */

        photos.forEach((photo, index) => {

            photo.parentElement.addEventListener(
                "click",
                () => openPreview(index)
            );

        });


        closePreview.addEventListener(
            "click",
            closePreviewWindow
        );


        nextBtn.addEventListener(
            "click",
            nextPhoto
        );


        previousBtn.addEventListener(
            "click",
            previousPhoto
        );


        downloadBtn.addEventListener(
            "click",
            downloadPhoto
        );


        /* =========================
           CLICK OUTSIDE IMAGE
        ========================= */

        preview.addEventListener("click", (event) => {

            if (event.target === preview) {
                closePreviewWindow();
            }

        });


        /* =========================
           KEYBOARD CONTROLS
        ========================= */

        document.addEventListener("keydown", (event) => {

            if (!preview.classList.contains("show")) {
                return;
            }

            if (event.key === "Escape") {
                closePreviewWindow();
            }

            if (event.key === "ArrowRight") {
                nextPhoto();
            }

            if (event.key === "ArrowLeft") {
                previousPhoto();
            }

        });

    </script>

</body>
</html>
