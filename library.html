<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #050505;
            color: white;
            overflow-x: hidden;
        }

        /* NAVIGATION */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            padding: 20px 50px;

            background: rgba(10, 10, 10, 0.8);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 1000;
        }

        nav h2 {
            font-size: 20px;
            font-weight: 700;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: #cccccc;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: white;
        }

        /* LIBRARY */

        .library {
            min-height: 100vh;
            padding: 140px 8% 100px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,0.04),
                    transparent 30%
                ),
                #050505;
        }

        .library h1 {
            text-align: center;
            font-size: 50px;
            margin-bottom: 60px;
            animation: titleIn 1s ease;
        }

        /* PHOTO GRID */

        .photos {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 30px;

            max-width: 1200px;

            margin: auto;
        }

        /* CARD */

        .photo {
            padding: 15px;

            background: rgba(255,255,255,0.06);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 20px;

            overflow: hidden;

            opacity: 0;

            animation:
                photoIn 0.8s ease forwards;

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .photo:hover {
            transform:
                translateY(-8px)
                scale(1.02);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.7);
        }

        /* IMAGE */

        .photo img {
            width: 100%;
            height: 250px;

            object-fit: cover;

            border-radius: 13px;

            display: block;

            cursor: pointer;

            transition:
                transform 0.5s ease,
                filter 0.4s ease;
        }

        .photo:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* TITLE */

        .photo h3 {
            text-align: center;

            margin-top: 16px;
            margin-bottom: 10px;

            font-size: 18px;
        }

        /* SMALL DOWNLOAD */

        .download-button {
            display: block;

            width: fit-content;

            margin: 5px auto 3px;

            padding: 6px 12px;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.12);

            color: #bbbbbb;

            text-decoration: none;

            font-size: 12px;

            transition: 0.3s;
        }

        .download-button:hover {
            color: white;

            background:
                rgba(255,255,255,0.15);
        }

        /* POPUP */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.9);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.3s ease;

            z-index: 2000;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        /* POPUP IMAGE */

        .modal img {
            max-width: 90vw;
            max-height: 80vh;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 20px 80px
                rgba(0,0,0,0.9);

            animation:
                popupIn 0.3s ease;
        }

        /* CLOSE */

        .close-button {
            position: fixed;

            top: 25px;
            right: 30px;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.2);

            background:
                rgba(255,255,255,0.08);

            color: white;

            font-size: 25px;

            cursor: pointer;

            z-index: 2100;
        }

        .close-button:hover {
            background:
                rgba(255,255,255,0.2);
        }

        /* POPUP DOWNLOAD */

        .modal-download {
            position: fixed;

            bottom: 30px;
            left: 50%;

            transform:
                translateX(-50%);

            padding: 8px 15px;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.1);

            border:
                1px solid
                rgba(255,255,255,0.18);

            color: white;

            text-decoration: none;

            font-size: 13px;

            z-index: 2100;

            transition: 0.3s;
        }

        .modal-download:hover {
            background:
                rgba(255,255,255,0.2);

            transform:
                translateX(-50%)
                translateY(-3px);
        }

        /* ANIMATIONS */

        @keyframes titleIn {

            from {
                opacity: 0;
                transform:
                    translateY(-30px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

        @keyframes photoIn {

            from {
                opacity: 0;
                transform:
                    translateY(60px)
                    scale(0.9);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @keyframes popupIn {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
            }

            nav ul {
                gap: 12px;
            }

            nav a {
                font-size: 13px;
            }

            .library {
                padding:
                    120px 20px 70px;
            }

            .library h1 {
                font-size: 38px;
            }

        }

    </style>
</head>

<body>

    <!-- NAVIGATION -->

    <nav>

        <h2>My Website</h2>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="library.html">
                    Library
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

        </ul>

    </nav>


    <!-- LIBRARY -->

    <section class="library">

        <h1>
            Photo Library
        </h1>

        <div
            class="photos"
            id="photoContainer">
        </div>

    </section>


    <!-- POPUP -->

    <div
        class="modal"
        id="photoModal">

        <button
            class="close-button"
            id="closeButton">

            ×

        </button>

        <img
            id="modalImage"
            src=""
            alt="Photo Preview">

        <a
            id="modalDownload"
            class="modal-download"
            href=""
            download>

            ↓ Download

        </a>

    </div>


    <script>

        /*
        =====================================
        PHOTOS
        =====================================

        IMPORTANT:

        Your photos are directly in the
        GitHub repository.

        THERE IS NO images/ FOLDER.

        Therefore use only:

        wallpaper1.jpg
        wallpaper2.jpg
        etc.
        */

        const photos = [

            "wallpaper1.jpg",
            "wallpaper2.jpg",
            "wallpaper3.jpg",
            "wallpaper4.jpg"

        ];


        /* CONTAINER */

        const container =
            document.getElementById(
                "photoContainer"
            );


        /* POPUP */

        const modal =
            document.getElementById(
                "photoModal"
            );

        const modalImage =
            document.getElementById(
                "modalImage"
            );

        const modalDownload =
            document.getElementById(
                "modalDownload"
            );

        const closeButton =
            document.getElementById(
                "closeButton"
            );


        /* CREATE PHOTOS */

        photos.forEach(
            (photo, index) => {

                /* CARD */

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "photo";


                /* ANIMATION DELAY */

                card.style.animationDelay =
                    (index * 0.15) + "s";


                /* IMAGE */

                const image =
                    document.createElement(
                        "img"
                    );

                /*
                IMPORTANT:

                No "images/" here because
                your photos are in the
                repository root.
                */

                image.src = photo;

                image.alt =
                    "Photo " +
                    (index + 1);


                /* CLICK PHOTO */

                image.addEventListener(
                    "click",
                    function() {

                        modalImage.src =
                            photo;

                        modalDownload.href =
                            photo;

                        modal.classList.add(
                            "active"
                        );

                        document.body.style.overflow =
                            "hidden";

                    }
                );


                /* TITLE */

                const title =
                    document.createElement(
                        "h3"
                    );

                title.textContent =
                    "Photo " +
                    (index + 1);


                /* DOWNLOAD */

                const download =
                    document.createElement(
                        "a"
                    );

                download.textContent =
                    "↓ Download";

                download.href =
                    photo;

                download.download =
                    photo;

                download.className =
                    "download-button";


                /* ADD */

                card.appendChild(
                    image
                );

                card.appendChild(
                    title
                );

                card.appendChild(
                    download
                );

                container.appendChild(
                    card
                );

            }
        );


        /* CLOSE POPUP */

        function closeModal() {

            modal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }


        closeButton.addEventListener(
            "click",
            closeModal
        );


        /* CLICK OUTSIDE */

        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === modal
                ) {

                    closeModal();

                }

            }
        );


        /* ESC KEY */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );

    </script>

</body>
</html>
