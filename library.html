<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 70px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(11, 11, 15, 0.96);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            padding: 70px 20px 45px;
        }

        .header h1 {
            font-size: clamp(38px, 6vw, 65px);
            margin-bottom: 15px;
        }

        .header p {
            max-width: 650px;
            margin: auto;
            color: #999;
            line-height: 1.7;
        }

        /* =========================
           PHOTO GRID
        ========================= */

        .gallery {
            width: 90%;
            max-width: 1400px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(230px, 1fr)
            );

            gap: 20px;
            padding-bottom: 80px;
        }

        /* =========================
           PHOTO CARD
        ========================= */

        .photo {
            position: relative;
            overflow: hidden;

            aspect-ratio: 16 / 10;

            border-radius: 16px;
            background: #17171d;

            cursor: pointer;

            contain: layout paint;
        }

        .photo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            /* Important for loading performance */
            opacity: 0;

            transition:
                opacity 0.25s ease,
                transform 0.35s ease;
        }

        .photo img.loaded {
            opacity: 1;
        }

        .photo:hover img {
            transform: scale(1.04);
        }

        /* =========================
           PREVIEW OVERLAY
        ========================= */

        .photo::after {
            content: "Preview";

            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.35);

            opacity: 0;

            font-size: 16px;
            font-weight: bold;

            transition: opacity 0.2s ease;

            pointer-events: none;
        }

        .photo:hover::after {
            opacity: 1;
        }

        /* =========================
           FULL SCREEN PREVIEW
        ========================= */

        .preview {
            position: fixed;
            inset: 0;

            z-index: 5000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(0, 0, 0, 0.96);
        }

        .preview.active {
            display: flex;
        }

        .preview-image {
            max-width: 90vw;
            max-height: 78vh;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7);
        }

        /* =========================
           CLOSE BUTTON
        ========================= */

        .close {
            position: absolute;

            top: 22px;
            right: 25px;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 28px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            position: absolute;

            bottom: 28px;

            display: flex;

            align-items: center;

            gap: 12px;
        }

        .control {
            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.13);

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* =========================
           DOWNLOAD
        ========================= */

        .download {
            background: white;
            color: black;
            font-weight: bold;
        }

        .download:hover {
            background: #ddd;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .header {
                padding: 50px 20px 35px;
            }

            .gallery {
                width: 94%;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .photo {
                border-radius: 10px;
            }

            .preview {
                padding: 15px;
            }

            .preview-image {
                max-width: 96vw;
                max-height: 74vh;
            }

            .control {
                padding: 10px 14px;
                font-size: 13px;
            }

            .close {
                top: 15px;
                right: 15px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>

</head>


<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="logo">
            Photo Library
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="library.html" class="active">
                    Library
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================
         HEADER
    ========================= -->

    <section class="header">

        <h1>
            Photo Library
        </h1>

        <p>
            Explore the collection. Click any photo
            to preview it and download the original.
        </p>

    </section>


    <!-- =========================
         PHOTO LIBRARY
    ========================= -->

    <main class="gallery">


        <div class="photo">

            <img
                data-src="wallpaper1.jpg"
                alt="Photo"
                width="800"
                height="500"
                decoding="async">

        </div>


        <div class="photo">

            <img
                data-src="wallpaper2.jpg"
                alt="Photo"
                width="800"
                height="500"
                decoding="async">

        </div>


        <div class="photo">

            <img
                data-src="wallpaper3.jpg"
                alt="Photo"
                width="800"
                height="500"
                decoding="async">

        </div>


        <div class="photo">

            <img
                data-src="wallpaper4.jpg"
                alt="Photo"
                width="800"
                height="500"
                decoding="async">

        </div>


        <div class="photo">

            <img
                data-src="wallpaper5.jpg"
                alt="Photo"
                width="800"
                height="500"
                decoding="async">

        </div>


    </main>


    <!-- =========================
         PHOTO PREVIEW
    ========================= -->

    <div
        class="preview"
        id="preview">

        <button
            class="close"
            id="close"
            aria-label="Close preview">

            ×

        </button>


        <img
            class="preview-image"
            id="previewImage"
            src=""
            alt="Photo Preview">


        <div class="controls">

            <button
                class="control"
                id="previous"
                aria-label="Previous photo">

                ←

            </button>


            <button
                class="control download"
                id="download">

                ↓ Download

            </button>


            <button
                class="control"
                id="next"
                aria-label="Next photo">

                →

            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const photos =
            document.querySelectorAll(".photo img");

        const preview =
            document.getElementById("preview");

        const previewImage =
            document.getElementById("previewImage");

        const close =
            document.getElementById("close");

        const previous =
            document.getElementById("previous");

        const next =
            document.getElementById("next");

        const download =
            document.getElementById("download");

        let currentPhoto = 0;


        /* =========================
           FAST LAZY LOADING
        ========================= */

        const imageObserver =
            new IntersectionObserver(
                function(entries, observer) {

                    entries.forEach(function(entry) {

                        if (!entry.isIntersecting) {
                            return;
                        }

                        const image = entry.target;

                        const source =
                            image.dataset.src;

                        if (source) {

                            image.src = source;

                            image.onload = function() {

                                image.classList.add("loaded");

                            };

                            image.onerror = function() {

                                image.classList.add("loaded");

                            };

                            delete image.dataset.src;

                        }

                        observer.unobserve(image);

                    });

                },
                {
                    rootMargin: "250px 0px",
                    threshold: 0.01
                }
            );


        photos.forEach(function(image) {

            imageObserver.observe(image);

        });


        /* =========================
           GET IMAGE SOURCE
        ========================= */

        function getImageSource(image) {

            return image.src ||
                   image.dataset.src;

        }


        /* =========================
           OPEN PREVIEW
        ========================= */

        function openPhoto(index) {

            currentPhoto = index;

            const source =
                getImageSource(
                    photos[currentPhoto]
                );

            previewImage.src = source;

            preview.classList.add("active");

            document.body.style.overflow = "hidden";

        }


        /* =========================
           CLOSE PREVIEW
        ========================= */

        function closePhoto() {

            preview.classList.remove("active");

            document.body.style.overflow = "";

            previewImage.src = "";

        }


        /* =========================
           NEXT PHOTO
        ========================= */

        function showNext() {

            currentPhoto++;

            if (currentPhoto >= photos.length) {

                currentPhoto = 0;

            }

            previewImage.src =
                getImageSource(
                    photos[currentPhoto]
                );

        }


        /* =========================
           PREVIOUS PHOTO
        ========================= */

        function showPrevious() {

            currentPhoto--;

            if (currentPhoto < 0) {

                currentPhoto =
                    photos.length - 1;

            }

            previewImage.src =
                getImageSource(
                    photos[currentPhoto]
                );

        }


        /* =========================
           DOWNLOAD
        ========================= */

        function downloadPhoto() {

            const image =
                photos[currentPhoto];

            const source =
                getImageSource(image);

            const link =
                document.createElement("a");

            link.href = source;

            link.download =
                source
                    .split("/")
                    .pop();

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

        }


        /* =========================
           PHOTO CLICK
        ========================= */

        photos.forEach(
            function(photo, index) {

                photo.parentElement.addEventListener(
                    "click",
                    function() {

                        openPhoto(index);

                    }
                );

            }
        );


        /* =========================
           BUTTONS
        ========================= */

        close.addEventListener(
            "click",
            closePhoto
        );

        next.addEventListener(
            "click",
            showNext
        );

        previous.addEventListener(
            "click",
            showPrevious
        );

        download.addEventListener(
            "click",
            downloadPhoto
        );


        /* =========================
           BACKGROUND CLOSE
        ========================= */

        preview.addEventListener(
            "click",
            function(event) {

                if (event.target === preview) {

                    closePhoto();

                }

            }
        );


        /* =========================
           KEYBOARD CONTROLS
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    !preview.classList.contains("active")
                ) {

                    return;

                }

                if (event.key === "Escape") {

                    closePhoto();

                }

                if (event.key === "ArrowRight") {

                    showNext();

                }

                if (event.key === "ArrowLeft") {

                    showPrevious();

                }

            }
        );

    </script>

</body>

</html>
