<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: #050505;
            color: #f5f5f5;
            overflow-x: hidden;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            padding: 20px 50px;

            background: rgba(10, 10, 10, 0.75);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 1000;

            animation: navDown 0.8s ease;
        }

        nav h2 {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: #cfcfcf;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }


        /* =========================
           LIBRARY
        ========================= */

        .library {
            min-height: 100vh;

            padding: 140px 8% 100px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,0.04),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255,255,255,0.03),
                    transparent 30%
                ),
                #050505;
        }


        /* TITLE */

        .library h1 {
            text-align: center;

            margin-bottom: 60px;

            font-size: 50px;

            font-weight: 700;

            color: #ffffff;

            animation: titleAppear 1s ease;
        }


        /* =========================
           PHOTO GRID
        ========================= */

        .photos {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 30px;

            max-width: 1200px;

            margin: auto;
        }


        /* =========================
           PHOTO CARD
        ========================= */

        .photo {
            background: rgba(255,255,255,0.06);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 20px;

            padding: 15px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.45),
                inset 0 1px 1px rgba(255,255,255,0.04);

            overflow: hidden;

            opacity: 0;

            animation: photoAppear 0.9s ease forwards;

            transition:
                transform 0.5s ease,
                box-shadow 0.5s ease,
                border-color 0.5s ease;
        }

        .photo:hover {
            transform: translateY(-10px) scale(1.02);

            border-color:
                rgba(255,255,255,0.25);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.7);
        }


        /* =========================
           PHOTO IMAGE
        ========================= */

        .photo img {
            width: 100%;

            height: 250px;

            object-fit: cover;

            border-radius: 13px;

            display: block;

            cursor: pointer;

            transition:
                transform 0.6s ease,
                filter 0.4s ease;
        }

        .photo:hover img {
            transform: scale(1.05);

            filter: brightness(1.08);
        }


        /* =========================
           PHOTO TITLE
        ========================= */

        .photo h3 {
            margin-top: 17px;
            margin-bottom: 10px;

            text-align: center;

            font-size: 18px;

            color: #ffffff;

            font-weight: 600;
        }


        /* =========================
           SMALL DOWNLOAD BUTTON
        ========================= */

        .download-button {
            display: block;

            width: fit-content;

            margin: 8px auto 3px;

            padding: 7px 13px;

            border-radius: 8px;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.12);

            color: #bdbdbd;

            text-decoration: none;

            font-size: 12px;

            font-weight: 500;

            transition: 0.3s;
        }

        .download-button:hover {
            color: #ffffff;

            background: rgba(255,255,255,0.14);

            transform: translateY(-2px);
        }


        /* =========================
           POPUP
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.88);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 30px;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;

            z-index: 2000;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }


        /* =========================
           POPUP IMAGE
        ========================= */

        .modal-content {
            position: relative;

            max-width: 90vw;
            max-height: 90vh;

            display: flex;

            justify-content: center;
            align-items: center;

            animation: popupIn 0.35s ease;
        }

        .modal-content img {
            max-width: 90vw;

            max-height: 82vh;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 20px 80px rgba(0,0,0,0.8);
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            position: fixed;

            top: 25px;
            right: 30px;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.18);

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 25px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: 0.3s;

            z-index: 2100;
        }

        .close-button:hover {
            background: rgba(255,255,255,0.18);

            transform: rotate(90deg);
        }


        /* =========================
           POPUP DOWNLOAD
        ========================= */

        .modal-download {
            position: fixed;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            padding: 9px 17px;

            border-radius: 9px;

            background: rgba(255,255,255,0.10);

            border: 1px solid rgba(255,255,255,0.18);

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: 500;

            backdrop-filter: blur(10px);

            transition: 0.3s;

            z-index: 2100;
        }

        .modal-download:hover {
            background: rgba(255,255,255,0.18);

            transform:
                translateX(-50%)
                translateY(-3px);
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes navDown {

            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }

        }

        @keyframes titleAppear {

            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes photoAppear {

            from {
                opacity: 0;
                transform:
                    translateY(70px)
                    scale(0.9);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @keyframes popupIn {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
            }

            nav ul {
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            .library {
                padding: 120px 20px 70px;
            }

            .library h1 {
                font-size: 38px;
            }

            .photo img {
                height: 220px;
            }

            .modal-content img {
                max-width: 95vw;
                max-height: 80vh;
            }

        }

    </style>
</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <h2>My Website</h2>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="library.html">Library</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

        </ul>

    </nav>


    <!-- PHOTO LIBRARY -->

    <section class="library">

        <h1>Photo Library</h1>

        <div
            class="photos"
            id="photoContainer">
        </div>

    </section>


    <!-- PHOTO POPUP -->

    <div
        class="modal"
        id="photoModal">

        <button
            class="close-button"
            id="closeButton">

            ×

        </button>

        <div class="modal-content">

            <img
                id="modalImage"
                src=""
                alt="Photo Preview">

        </div>

        <a
            id="modalDownload"
            class="modal-download"
            href=""
            download>

            ↓ Download

        </a>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        /*
        ==========================================
        ADD YOUR PHOTOS HERE
        ==========================================

        Your photos are inside the "images"
        folder.

        So we use:

        images/filename.jpg
        */

        const photos = [

            "images/wallpaper1.jpg",
            "images/wallpaper2.jpg",
            "images/wallpaper3.jpg",
            "images/wallpaper4.jpg"

        ];


        /* PHOTO CONTAINER */

        const container =
            document.getElementById(
                "photoContainer"
            );


        /* POPUP ELEMENTS */

        const modal =
            document.getElementById(
                "photoModal"
            );

        const modalImage =
            document.getElementById(
                "modalImage"
            );

        const modalDownload =
            document.getElementById(
                "modalDownload"
            );

        const closeButton =
            document.getElementById(
                "closeButton"
            );


        /* CREATE PHOTO CARDS */

        photos.forEach((photo, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className = "photo";


            /* Animation */

            card.style.animationDelay =
                (index * 0.15) + "s";


            /* IMAGE */

            const image =
                document.createElement(
                    "img"
                );

            image.src = photo;

            image.alt =
                "Photo " + (index + 1);


            /* CLICK IMAGE */

            image.addEventListener(
                "click",
                function() {

                    modalImage.src = photo;

                    modalDownload.href = photo;

                    modal.classList.add(
                        "active"
                    );

                    document.body.style.overflow =
                        "hidden";

                }
            );


            /* TITLE */

            const title =
                document.createElement(
                    "h3"
                );

            title.textContent =
                "Photo " + (index + 1);


            /* DOWNLOAD */

            const download =
                document.createElement(
                    "a"
                );

            download.textContent =
                "↓ Download";

            download.href =
                photo;

            download.download =
                photo;

            download.className =
                "download-button";


            /* ADD TO CARD */

            card.appendChild(image);

            card.appendChild(title);

            card.appendChild(download);

            container.appendChild(card);

        });


        /* CLOSE POPUP */

        function closeModal() {

            modal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }


        closeButton.addEventListener(
            "click",
            closeModal
        );


        /* CLICK OUTSIDE */

        modal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === modal
                ) {

                    closeModal();

                }

            }
        );


        /* ESCAPE KEY */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );

    </script>

</body>
</html>
